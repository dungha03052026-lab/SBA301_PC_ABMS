spring.application.name=ApartmentBS
server.port=8080

# Database Configuration (MSSQL Server)
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=ApartmentDB;trustServerCertificate=true;encrypt=false;
spring.datasource.username=as
spring.datasource.password=1
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

